# Render Blueprint - optional; you can also set Build/Start in the dashboard.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: no-login-resume-builder
    runtime: node
    buildCommand: npm install && npm run build && PLAYWRIGHT_BROWSERS_PATH=/opt/render/.cache/playwright npx playwright install chromium
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
